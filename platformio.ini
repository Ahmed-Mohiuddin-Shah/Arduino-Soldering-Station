; nanoatmega328[_buzzer]    = Old Bootloader (ATmega328P, 57600)
; nanoatmega328new[_buzzer] = New Bootloader (ATmega328P, 115200)
; *_buzzer envs enable USE_BUZZER (passive piezo on A3)

[env]
platform = atmelavr
framework = arduino
lib_deps =
	adafruit/Adafruit SSD1306
	adafruit/Adafruit GFX Library
	paulstoffregen/Encoder
	https://github.com/zhenek-kreker/MAX6675.git

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

[env:nanoatmega328_buzzer]
board = nanoatmega328
build_flags = -DUSE_BUZZER

[env:nanoatmega328new_buzzer]
board = nanoatmega328new
build_flags = -DUSE_BUZZER
